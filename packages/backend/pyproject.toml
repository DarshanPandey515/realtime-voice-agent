[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for voice agent browser interface"
requires-python = ">=3.12"
dependencies = [
    "voice-agent",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.scripts]
voice-backend = "backend.main:main"

[tool.uv.sources]
voice-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
